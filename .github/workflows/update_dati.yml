name: Aggiornamento Giornaliero Portate

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  aggiorna-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Scarica la repository
        uses: actions/checkout@v5

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: |
          pip install pandas pyarrow requests

      - name: Esegui script di aggiornamento
        run: |
          python scripts/aggiorna_dati.py

      - name: Salva i nuovi dati su GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento automatico storico FVG $(date +'%Y-%m-%d')" && git push)
